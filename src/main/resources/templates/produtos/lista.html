<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <title>Gerenciar Produtos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-boxes me-2 text-primary"></i>Produtos
        </h2>
        <button class="btn btn-primary" data-bs-toggle="collapse" data-bs-target="#formularioProduto"
                sec:authorize="hasRole('GERENTE')">
            <i class="bi bi-plus-lg me-1"></i> Novo Produto
        </button>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Formulário de Cadastro (GERENTE) -->
    <div class="collapse mb-3" id="formularioProduto" sec:authorize="hasRole('GERENTE')">
        <div class="card card-body shadow-sm">
            <form th:action="@{/produtos/salvar}" method="post">
                <div class="row g-3">
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Nome do Produto</label>
                        <input type="text" id="nome" name="nome" class="form-control" required>
                    </div>
                    <div class="col-md-3">
                        <label for="tipo" class="form-label">Tipo</label>
                        <select id="tipo" name="tipo" class="form-select" required>
                            <option value="" disabled selected>Selecione</option>
                            <option value="Pizza">Pizza</option>
                            <option value="Lanche">Lanche</option>
                            <option value="Bebida">Bebida</option>
                            <option value="Porção">Porção</option>
                            <option value="Adicional">Adicional</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" id="preco" name="preco" class="form-control" step="0.01" min="0.01" required>
                    </div>
                    <div class="col-md-2 d-flex align-items-end">
                        <div class="form-check mb-2">
                            <input type="checkbox" id="ativo" name="ativo" value="true" class="form-check-input" checked>
                            <label for="ativo" class="form-check-label">Ativo</label>
                        </div>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100">Salvar</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Listagem de Produtos -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4" sec:authorize="hasRole('GERENTE')">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null} ? 'R$ ' + ${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')} : '-'"></td>
                        <td th:text="${produto.ativo == false} ? 'Não' : 'Sim'"></td>
                        <td class="text-end pe-4" sec:authorize="hasRole('GERENTE')">
                            <form th:action="@{/produtos/{id}/excluir(id=${produto.id})}" method="post" class="d-inline"
                                  onsubmit="return confirm('Tem certeza que deseja excluir este produto?');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">
                                    <i class="bi bi-trash-fill"></i> Excluir
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

</body>
</html>
