<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Token CSRF para chamadas fetch() (forms com th:action já recebem automaticamente) -->
        <meta name="_csrf" th:content="${_csrf.token}">
        <meta name="_csrf_header" th:content="${_csrf.headerName}">
        <title>Pediu Patrão - Sistema de Pedidos</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <script>
            // Cabeçalhos para enviar em fetch() que alteram dados (POST, PUT, DELETE)
            function csrfHeaders(extra) {
                const token = document.querySelector('meta[name="_csrf"]').content;
                const header = document.querySelector('meta[name="_csrf_header"]').content;
                return Object.assign({ [header]: token }, extra || {});
            }
        </script>
    </head>
    <body>
        <!-- Botão para abrir/fechar a sidebar em telas pequenas -->
        <div class="toggle-btn btn btn-dark d-md-none">
            <span>&#9776;</span>
        </div>

        <!-- Sidebar incluído como fragmento -->
        <aside>
            <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="container-fluid mt-4">
            <!-- Usuário logado, perfil e botão de sair -->
            <div class="d-flex justify-content-end align-items-center gap-3 mb-3" sec:authorize="isAuthenticated()">
                <span class="text-muted small">
                    <i class="bi bi-person-circle me-1"></i>
                    <strong sec:authentication="name"></strong>
                    <span class="badge bg-secondary ms-1" th:text="${currentRole}"></span>
                </span>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        <i class="bi bi-box-arrow-right me-1"></i>Sair
                    </button>
                </form>
            </div>

            <div th:replace="~{__${content}__}"></div>
        </main>

        <script th:src="@{/js/script.js}"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
