<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Novo Pedido</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a href="/pedidos" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0">Novo Pedido</h2>
    </div>

    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <form th:action="@{/pedidos/salvar}" method="post">
        <div class="card shadow-sm mb-3" style="max-width: 820px;">
            <div class="card-body">
                <label for="clienteId" class="form-label fw-medium">
                    <i class="bi bi-person me-1"></i>Cliente
                </label>
                <select id="clienteId" name="clienteId" class="form-select" required>
                    <option value="" selected disabled>Selecione o cliente</option>
                    <option th:each="c : ${clientes}" th:value="${c.id}" th:text="${c.nome}"></option>
                </select>
                <div class="form-text" th:if="${#lists.isEmpty(clientes)}">
                    Nenhum cliente cadastrado. Cadastre um cliente antes de registrar o pedido.
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-3" style="max-width: 820px;">
            <div class="card-body p-0">
                <table class="table align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th class="ps-4">Produto</th>
                            <th>Tipo</th>
                            <th>Preço unitário</th>
                            <th style="width: 140px;">Quantidade</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${#lists.isEmpty(produtos)}">
                            <td colspan="4" class="text-center text-muted py-4">Nenhum produto ativo.</td>
                        </tr>
                        <tr th:each="p : ${produtos}">
                            <td class="ps-4" th:text="${p.nome}"></td>
                            <td th:text="${p.tipo}"></td>
                            <td th:text="'R$ ' + ${#numbers.formatDecimal(p.preco, 1, 'POINT', 2, 'COMMA')}"></td>
                            <td>
                                <!-- Só o id do produto e a quantidade são enviados: os preços são calculados no servidor -->
                                <input type="number" class="form-control form-control-sm"
                                       th:name="'qty_' + ${p.id}" min="0" max="100" value="0">
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="card-footer small text-muted">
                O valor total é calculado pelo servidor com base nos preços cadastrados.
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-check-lg me-1"></i> Registrar Pedido
            </button>
            <a href="/pedidos" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>

</div>

</body>
</html>
